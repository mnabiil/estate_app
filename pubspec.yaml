name: estate_app
description: Amani Living - aplikasi manajemen perumahan (prototipe) untuk Android & iOS.
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ^3.6.0

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^5.1.0
  firebase_auth: ^7.0.1
  cloud_firestore: ^7.1.0
  cloud_functions: ^7.0.1
  firebase_messaging: ^17.0.1
  firebase_storage: ^14.0.1
  image_picker: ^1.1.2
  file_picker: ^13.3.2
  url_launcher: ^6.3.2
  excel: ^4.0.6
  # Jadwal sholat & adzan
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.0
  geolocator: ^14.0.2
  sensors_plus: ^7.0.0
  shared_preferences: ^2.5.3
  path_provider: ^2.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    # Suara adzan untuk notifikasi iOS (potongan ≤ 30 detik, disalin ke
    # Library/Sounds saat aplikasi dibuka). Android: android/app/src/main/res/raw/.
    - assets/adzan/

  # Font dari Google Fonts (SIL Open Font License, lihat assets/fonts/OFL-*.txt).
  fonts:
    - family: Lato
      fonts:
        - asset: assets/fonts/Lato_400Regular.ttf
        - asset: assets/fonts/Lato_700Bold.ttf
          weight: 700
        - asset: assets/fonts/Lato_900Black.ttf
          weight: 900
    - family: Raleway
      fonts:
        - asset: assets/fonts/Raleway_500Medium.ttf
          weight: 500
        - asset: assets/fonts/Raleway_600SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Raleway_700Bold.ttf
          weight: 700
        - asset: assets/fonts/Raleway_800ExtraBold.ttf
          weight: 800
